<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Directory</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }
        .truck-container {
            margin-bottom: 15px;
        }
        /* Delivery truck styling */
        .truck-icon {
            width: 100px;
            height: auto;
        }
        .profile h1 {
            font-size: 26px;
            color: #4D148C; /* FedEx Purple */
            margin-bottom: 5px;
            margin-top: 10px;
        }
        .profile p {
            color: #FF6600; /* FedEx Orange */
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
        }
        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            color: #4D148C; /* FedEx Purple */
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            border: 2px solid #4D148C;
            border-radius: 30px;
            transition: all 0.2s ease;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .phone-icon {
            color: #FF6600; /* FedEx Orange */
            margin-right: 10px;
            font-size: 20px;
        }
        .link-button:hover, .link-button:active {
            background-color: #4D148C;
            color: #ffffff;
            transform: translateY(-2px);
        }
        /* Change orange icon to white when the button is pressed/hovered */
        .link-button:hover .phone-icon, .link-button:active .phone-icon {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="profile">
        <div class="truck-container">
            <!-- SVG Delivery Truck Graphic -->
            <svg class="truck-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Truck Body (Purple) -->
                <path d="M1 6C1 4.89543 1.89543 4 3 4H15C16.1046 4 17 4.89543 17 6V17H1V6Z" fill="#4D148C"/>
                <!-- Truck Cab (Purple) -->
                <path d="M17 9H20.5L23.5 13V17H17V9Z" fill="#4D148C"/>
                <!-- Cab Window -->
                <path d="M18 10H20L22 13H18V10Z" fill="#f4f4f9"/>
                <!-- Wheels (Orange) -->
                <circle cx="5.5" cy="18.5" r="2.5" fill="#FF6600"/>
                <circle cx="19.5" cy="18.5" r="2.5" fill="#FF6600"/>
                <!-- Road line -->
                <path d="M1 21H23" stroke="#4D148C" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Driver Directory</h1>
        <p>Tap a name to call instantly</p>
    </div>

    <div class="links-container">
        <a href="tel:8174494466" class="link-button">
            <span class="phone-icon">📞</span> Mark Francis
        </a>
        <a href="tel:2144699446" class="link-button">
            <span class="phone-icon">📞</span> Kymighia Jackson
        </a>
        <a href="tel:3144651499" class="link-button">
            <span class="phone-icon">📞</span> Antonio Jackson
        </a>
        <a href="tel:8178750747" class="link-button">
            <span class="phone-icon">📞</span> Jesus Pasos
        </a>
        <a href="tel:6822341522" class="link-button">
            <span class="phone-icon">📞</span> Jose Garcia
        </a>
    </div>

</body>
</html>
